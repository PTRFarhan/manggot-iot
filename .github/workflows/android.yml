# Build APK Android otomatis setiap ada push ke main.
# Hasil: tab Actions (artifact) dan halaman Releases (manggot-iot.apk).
name: Build APK Android

on:
  push:
    branches: [main]
    paths-ignore:
      - "esp32/**"
      - "wokwi/**"
      - "firmware/**"
      - "**.md"
      - "**.bat"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Siapkan file aplikasi
        run: |
          mkdir -p app/www app/assets
          cp index.html style.css app.js firebase-config.js manifest.json app/www/
          cp -r icons app/www/
          cp android-build/package.json android-build/capacitor.config.json app/
          cp android-build/icon-*.png android-build/splash*.png app/assets/

      - name: Install Capacitor
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Buat proyek Android
        working-directory: app
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Atur versi
        working-directory: app/android
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle

      - name: Build APK
        working-directory: app/android
        run: |
          mkdir -p ~/.android
          cp ../../android-build/debug.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../manggot-iot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: manggot-iot-apk
          path: manggot-iot.apk

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Aplikasi Android Manggot IoT (terbaru)
          body: |
            APK terbaru, versi 1.0.${{ github.run_number }}.
            Unduh manggot-iot.apk, buka di HP Android, izinkan "Instal dari sumber ini", lalu Instal.
            Update cukup instal ulang di atas versi lama (data login tetap).
          files: manggot-iot.apk
          make_latest: true
          overwrite_files: true
