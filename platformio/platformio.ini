; =====================================================================
;  Manggot IoT (ESP32) - PlatformIO
;  Build  : pio run -e esp32dev
;  Upload : pio run -e esp32dev -t upload
;  Monitor: pio device monitor
; =====================================================================

[platformio]
default_envs = esp32dev

[env]
; Arduino core ESP32 versi 3.x (pioarduino). Platform resmi PlatformIO masih core 2.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
board_build.partitions = min_spiffs.csv     ; 1.9MB app x2 (OTA) + LittleFS 190KB
board_build.filesystem = littlefs
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
extra_scripts = post:scripts/copy_bin.py

; ESP32 asli (relay active LOW, WiFi dari secrets.h)
[env:esp32dev]

; Firmware untuk simulasi Wokwi (relay aktif HIGH). WiFi Wokwi-GUEST diatur di secrets.h
[env:wokwi]
board_build.partitions = default.csv
build_flags =
    ${env.build_flags}
    -DWOKWI_SIM=1
