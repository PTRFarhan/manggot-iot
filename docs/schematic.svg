<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect width="1240" height="800" fill="#ffffff"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">Skematik Inkubator Manggot IoT (ESP32)</text>
  <text x="40" y="74" font-size="14" fill="#64748b">Bus I2C bersama: SDA GPIO21, SCL GPIO22 · Relay 2 channel active LOW · bagian bertanda * sesuaikan dengan komponen kamu</text>

  <!-- ESP32 -->
  <rect x="470" y="200" width="260" height="400" rx="14" fill="#1e293b"/>
  <text x="600" y="235" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">ESP32 DevKit</text>
  <g font-size="14" fill="#e2e8f0">
    <text x="485" y="290">3V3</text><text x="485" y="330">GND</text><text x="485" y="370">GPIO21 (SDA)</text><text x="485" y="410">GPIO22 (SCL)</text>
    <text x="715" y="290" text-anchor="end">5V / VIN</text><text x="715" y="330" text-anchor="end">GND</text>
    <text x="715" y="430" text-anchor="end">GPIO26</text><text x="715" y="470" text-anchor="end">GPIO27</text><text x="715" y="530" text-anchor="end">GPIO2 (LED)</text>
  </g>
  <g fill="#22c55e"><circle cx="470" cy="285" r="5"/><circle cx="470" cy="325" r="5"/><circle cx="470" cy="365" r="5"/><circle cx="470" cy="405" r="5"/>
  <circle cx="730" cy="285" r="5"/><circle cx="730" cy="325" r="5"/><circle cx="730" cy="425" r="5"/><circle cx="730" cy="465" r="5"/><circle cx="730" cy="525" r="5"/></g>

  <!-- LCD -->
  <rect x="60" y="130" width="250" height="150" rx="12" fill="#0c4a6e"/>
  <rect x="80" y="152" width="210" height="60" rx="4" fill="#38bdf8" opacity=".35"/>
  <text x="185" y="187" font-size="13" fill="#e0f2fe" text-anchor="middle" font-family="Consolas, monospace">INKUBATOR MANGGOT</text>
  <text x="185" y="240" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">LCD 20x4 I2C (0x27)</text>
  <text x="185" y="262" font-size="12" fill="#bae6fd" text-anchor="middle">GND · VCC · SDA · SCL</text>

  <!-- SHT30 -->
  <rect x="60" y="430" width="250" height="120" rx="12" fill="#14532d"/>
  <text x="185" y="475" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Sensor SHT30 (0x44)</text>
  <text x="185" y="500" font-size="12" fill="#bbf7d0" text-anchor="middle">suhu + kelembapan</text>
  <text x="185" y="525" font-size="12" fill="#bbf7d0" text-anchor="middle">VCC · GND · SDA · SCL</text>

  <!-- wires left -->
  <g fill="none" stroke-width="3">
    <path d="M310 175 H760 V285 H730" stroke="#ef4444"/>
    <path d="M310 455 H400 V285 H470" stroke="#ef4444"/>
    <path d="M310 195 H420 V325 H470" stroke="#111827"/>
    <path d="M310 475 H420 V325" stroke="#111827"/>
    <path d="M310 215 H440 V365 H470" stroke="#16a34a"/>
    <path d="M310 495 H440 V365" stroke="#16a34a"/>
    <path d="M310 235 H455 V405 H470" stroke="#2563eb"/>
    <path d="M310 515 H455 V405" stroke="#2563eb"/>
  </g>
  <g font-size="11" fill="#475569"><text x="318" y="170">VCC 5V (ke pin 5V ESP32)</text><text x="318" y="450">VCC 3V3</text></g>

  <!-- Relay module -->
  <rect x="850" y="380" width="200" height="170" rx="12" fill="#1d4ed8"/>
  <text x="950" y="410" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Modul Relay 2CH</text>
  <text x="950" y="430" font-size="12" fill="#dbeafe" text-anchor="middle">active LOW (bisa diubah di aplikasi)</text>
  <g font-size="13" fill="#fff"><text x="865" y="465">IN1</text><text x="865" y="495">IN2</text><text x="865" y="525">VCC / GND</text></g>
  <path d="M730 425 H800 V460 H850" stroke="#f97316" stroke-width="3" fill="none"/>
  <path d="M730 465 H790 V490 H850" stroke="#a855f7" stroke-width="3" fill="none"/>
  <path d="M730 285 H820 V520 H850" stroke="#ef4444" stroke-width="3" fill="none"/>
  <path d="M730 325 H810 V530 H850" stroke="#111827" stroke-width="3" fill="none"/>

  <!-- Loads -->
  <rect x="1090" y="250" width="130" height="120" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="1155" y="295" font-size="15" font-weight="700" fill="#075985" text-anchor="middle">Peltier</text>
  <text x="1155" y="315" font-size="15" font-weight="700" fill="#075985" text-anchor="middle">+ Kipas</text>
  <text x="1155" y="345" font-size="12" fill="#0369a1" text-anchor="middle">PENDINGIN</text>
  <rect x="1090" y="560" width="130" height="120" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1155" y="610" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">Lampu</text>
  <text x="1155" y="630" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">Pemanas</text>
  <text x="1155" y="658" font-size="12" fill="#b45309" text-anchor="middle">PEMANAS</text>
  <path d="M1050 460 H1070 V310 H1090" stroke="#0284c7" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <path d="M1050 490 H1070 V620 H1090" stroke="#d97706" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <text x="1220" y="240" font-size="11" fill="#475569" text-anchor="end">Relay 1 COM/NO → sumber DC peltier*</text>
  <text x="1220" y="705" font-size="11" fill="#475569" text-anchor="end">Relay 2 COM/NO → fasa lampu (AC 220 V, hati-hati)*</text>

  <!-- LED -->
  <circle cx="800" cy="600" r="12" fill="#22c55e"/><text x="820" y="605" font-size="12" fill="#475569">LED status WiFi</text>
  <path d="M730 525 H770 V600 H788" stroke="#22c55e" stroke-width="3" fill="none"/>

  <!-- legend -->
  <g font-size="12" fill="#334155">
    <rect x="40" y="640" width="380" height="120" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="60" y="665" font-weight="700">Warna kabel</text>
    <line x1="60" x2="90" y1="690" y2="690" stroke="#ef4444" stroke-width="3"/><text x="98" y="694">VCC</text>
    <line x1="160" x2="190" y1="690" y2="690" stroke="#111827" stroke-width="3"/><text x="198" y="694">GND</text>
    <line x1="260" x2="290" y1="690" y2="690" stroke="#16a34a" stroke-width="3"/><text x="298" y="694">SDA</text>
    <line x1="60" x2="90" y1="720" y2="720" stroke="#2563eb" stroke-width="3"/><text x="98" y="724">SCL</text>
    <line x1="160" x2="190" y1="720" y2="720" stroke="#f97316" stroke-width="3"/><text x="198" y="724">IN1</text>
    <line x1="260" x2="290" y1="720" y2="720" stroke="#a855f7" stroke-width="3"/><text x="298" y="724">IN2</text>
    <text x="60" y="748">Relay ditukar di aplikasi: IN1 ↔ IN2 tertukar fungsinya</text>
  </g>
</svg>
